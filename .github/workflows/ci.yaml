name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: [v*]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Node.js and dependencies
        uses: mcous/js/actions/setup@main

      - name: Build and check
        run: pnpm build-and-check

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-dist
          path: dist

  matrix:
    name: Read compatibility matrix
    runs-on: ubuntu-latest

    outputs:
      runtime: ${{ steps.cells.outputs.runtime }}
      typecheck: ${{ steps.cells.outputs.typecheck }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Read cells
        id: cells
        run: |
          echo "runtime=$(jq -c '.runtime' compat/matrix.json)" >> "$GITHUB_OUTPUT"
          echo "typecheck=$(jq -c '.typecheck' compat/matrix.json)" >> "$GITHUB_OUTPUT"

  compat:
    name: Runtime / ${{ matrix.cell.name }}
    runs-on: ubuntu-latest
    needs: [build, matrix]
    continue-on-error: ${{ matrix.cell.allowFailure == true }}

    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.matrix.outputs.runtime) }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download built package
        uses: actions/download-artifact@v4
        with:
          name: npm-dist
          path: dist

      - name: Build cell image
        run: |
          docker build --file compat/Dockerfile --tag cell \
            --build-arg MODE=runtime \
            --build-arg NODE_VERSION=${{ matrix.cell.node }} \
            --build-arg VITEST_VERSION=${{ matrix.cell.vitest }} \
            --build-arg NPM_VERSION=${{ matrix.cell.npm }} \
            .

      - name: Run cell
        run: |
          docker run --name cell \
            ${{ matrix.cell.entry == 'src' && '--env VITEST_WHEN_ENTRY=/app/src/vitest-when.ts' || '' }} \
            cell

      - name: Extract coverage
        run: docker cp cell:/app/coverage/lcov.info lcov.info

      - name: Upload coverage
        uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b
        with:
          file: lcov.info
          flag-name: ${{ matrix.cell.name }}
          parallel: true

  types:
    name: Types / ${{ matrix.cell.name }}
    runs-on: ubuntu-latest
    needs: [build, matrix]

    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.matrix.outputs.typecheck) }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download built package
        uses: actions/download-artifact@v4
        with:
          name: npm-dist
          path: dist

      - name: Build cell image
        run: |
          docker build --file compat/Dockerfile --tag cell \
            --build-arg MODE=typecheck \
            --build-arg NODE_VERSION=${{ matrix.cell.node }} \
            --build-arg VITEST_VERSION=${{ matrix.cell.vitest }} \
            --build-arg TS_VERSION=${{ matrix.cell.typescript }} \
            .

      - name: Run cell
        run: docker run --rm cell

  coverage:
    name: Coverage finished
    runs-on: ubuntu-latest
    needs: compat

    steps:
      - uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b
        with:
          parallel-finished: true

  deploy:
    if: ${{ github.repository == 'mcous/vitest-when' && startsWith(github.ref, 'refs/tags/v') }}
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build, compat, types]
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: npm-dist
          path: dist

      - name: Publish to npm
        run: npm publish
