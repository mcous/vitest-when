name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: [v*]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    outputs:
      runtime: ${{ steps.envs.outputs.runtime }}
      typecheck: ${{ steps.envs.outputs.typecheck }}

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js and dependencies
        uses: mcous/js/actions/setup@8499f5e35da785f3ad117038d5029b1ced0766cf # main
        with:
          # disable cache on release builds to prevent cache poisoning
          cache: ${{ !startsWith(github.ref, 'refs/tags/v') }}

      - name: Build
        run: pnpm build

      - name: Read compatibility environments
        id: envs
        run: |
          {
            echo "runtime=$(./compat/list-environments.sh runtime)"
            echo "typecheck=$(./compat/list-environments.sh typecheck)"
          } >> "$GITHUB_OUTPUT"

      - name: Upload publish artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-dist
          path: dist

  test:
    name: Test / source
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js and dependencies
        uses: mcous/js/actions/setup@8499f5e35da785f3ad117038d5029b1ced0766cf # main
        with:
          # disable cache on release builds to prevent cache poisoning
          cache: ${{ !startsWith(github.ref, 'refs/tags/v') }}

      - name: Test
        run: pnpm coverage

      - name: Check formatting
        run: pnpm check:format

      - name: Check lint
        run: pnpm check:lint

      - name: Check types
        run: pnpm check:types

      - name: Upload coverage
        if: ${{ !cancelled() && hashFiles('coverage/lcov.info') != '' }}
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: coverage/lcov.info
          flag-name: source
          parallel: true

  compat:
    name: Test / Node.js ${{ matrix.environment.node }} / Vitest ${{ matrix.environment.vitest }}
    runs-on: ubuntu-latest
    needs: build

    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.build.outputs.runtime) }}

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download built package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-dist
          path: dist

      - name: Run environment
        env:
          ENVIRONMENT: ${{ matrix.environment.service }}
        run: docker compose -f compat/compose.yaml run --build --name compat "$ENVIRONMENT"

      - name: Extract coverage
        if: ${{ !cancelled() }}
        run: docker cp compat:/app/coverage/lcov.info lcov.info || true

      - name: Upload coverage
        if: ${{ !cancelled() && hashFiles('lcov.info') != '' }}
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: lcov.info
          flag-name: ${{ matrix.environment.service }}
          parallel: true
          allow-empty: true

  types:
    name: Types / Vitest ${{ matrix.environment.vitest }}
    runs-on: ubuntu-latest
    needs: build

    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.build.outputs.typecheck) }}

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download built package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-dist
          path: dist

      - name: Run environment
        env:
          ENVIRONMENT: ${{ matrix.environment.service }}
        run: docker compose -f compat/compose.yaml run --rm --build "$ENVIRONMENT"

  coverage:
    name: Coverage finished
    runs-on: ubuntu-latest
    needs: [test, compat]
    if: ${{ !cancelled() }}

    steps:
      - uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          parallel-finished: true

  deploy:
    if: ${{ github.repository == 'mcous/vitest-when' && startsWith(github.ref, 'refs/tags/v') }}
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build, test, compat, types]
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download publish artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-dist
          path: dist

      - name: Publish to npm
        run: npm publish
